name: RecipeApp
options:
  bundleIdPrefix: com.srinathk
  deploymentTarget:
    iOS: "18.4"
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
targets:
  RecipeApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srinathk.RecipeApp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Tiffin
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Tiffin uses your camera to photograph handwritten or printed recipes for import.
        ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)
    entitlements:
      path: Sources/RecipeApp.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.srinathk.RecipeApp
        com.apple.developer.icloud-services:
          - CloudKit
  RecipeAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/RecipeAppTests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.srinathk.RecipeAppTests
    dependencies:
      - target: RecipeApp
schemes:
  RecipeApp:
    build:
      targets:
        RecipeApp: all
        RecipeAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RecipeAppTests
    archive:
      config: Release
