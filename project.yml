name: RecipeApp
options:
  bundleIdPrefix: com.srinathk
  deploymentTarget:
    iOS: "18.4"
targets:
  RecipeApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srinathk.RecipeApp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Tiffin
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  RecipeAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/RecipeAppTests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.srinathk.RecipeAppTests
    dependencies:
      - target: RecipeApp
schemes:
  RecipeApp:
    build:
      targets:
        RecipeApp: all
        RecipeAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RecipeAppTests
    archive:
      config: Release
